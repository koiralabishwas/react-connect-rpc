syntax = "proto3";

// buf:lint:ignore PACKAGE_DIRECTORY_MATCH
package greet.v1;

// Defines where the generated Go code will live
option go_package = "my-rpc-app/gen/greet/v1;greetv1";

// ==========================================
// 1. Greet Feature
// ==========================================

message GreetRequest {
  string name = 1;
}

message GreetResponse {
  string greeting = 1;
}

// Service dedicated to greetings
service GreetService {
  rpc Greet(GreetRequest) returns (GreetResponse);
}

// ==========================================
// 2. Purchase Feature
// ==========================================

// The Input (What React sends to Go)
message PurchaseRequest {
  string product = 1;
  int32 quantity = 2;
  int32 price = 3;
}

// The Output (What Go sends back to React)
message PurchaseResponse {
  string receipt_id = 1;
  string product = 2;
  int32 quantity = 3;
  int32 total_price = 4;
}

// Service dedicated to store transactions
service PurchaseService {
  rpc Purchase(PurchaseRequest) returns (PurchaseResponse);
}

// ==========================================
// 3. Order Estimate Feature (Multi-params & Multi-results)
// ==========================================

message OrderItem {
  string item_name = 1;
  int32 unit_price = 2;
  int32 quantity = 3;
}

message OrderEstimateRequest {
  string customer_name = 1;
  repeated OrderItem items = 2;
  string coupon_code = 3;
  bool is_member = 4;
}

message OrderEstimateResponse {
  string estimate_id = 1;
  string customer_name = 2;
  int32 subtotal = 3;
  int32 discount_amount = 4;
  int32 tax_amount = 5;
  int32 total_amount = 6;
  repeated string applied_discounts = 7;
  string estimated_delivery = 8;
}

service OrderEstimateService {
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc Estimate(OrderEstimateRequest) returns (OrderEstimateResponse);
}
